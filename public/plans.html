<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recurly JS Demo — Plans</title>
  <script src="/plans"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS only -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
  <script src="https://js.recurly.com/v4/recurly.js"></script>
  <link href="https://js.recurly.com/v4/recurly.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container-fluid p-5">

    <header class="d-flex flex-wrap align-items-center justify-content-between pb-4 mb-4 border-bottom">
      <div class="d-flex align-items-center gap-3">
        <img id="preview" src="" style="max-height: 40px; width: auto;">
        <h1 id="nameBrand" class="mb-0 fs-4"></h1>
        <p id="brandMessage" class="mb-0 text-muted"></p>
      </div>
      <ul class="nav nav-pills">
        <li class="nav-item"><a href="#" class="nav-link active" aria-current="page">Home</a></li>
        <li class="nav-item"><a href="#" class="nav-link">Features</a></li>
        <li class="nav-item"><a href="#" class="nav-link">Pricing</a></li>
        <li class="nav-item"><a href="#" class="nav-link">FAQs</a></li>
        <li class="nav-item"><a href="#" class="nav-link">About</a></li>
      </ul>
    </header>

    <div class="p-5 border content rounded">
      <h2 class="pb-2">Choose Your Preferred Plan</h2>
      <div class="mb-4" style="max-width: 20rem;">
        <label for="currency-select">Select Currency:</label>
        <select class="form-control js-currency-select" id="currency-select" name="currency"></select>
      </div>
      <form class="js-plan-select row g-4 row-cols-1 row-cols-lg-4 justify-content-start" id="plan-form" method="get" action="/checkout">
      </form>
      <div id="errors" class="mt-3"></div>
      <div class="mt-4">
        <button id="checkout" class="btn btn-primary" form="plan-form">Checkout</button>
      </div>
    </div>

  </div>
  <script type="module" src="storage.js"></script>
  <script type="module" src="plans.js"></script>
</body>

</html>
